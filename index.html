<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro - Milhões</title>

    <script>
        // NASA moved APOD to science.nasa.gov in Sept 2026. This endpoint needs no API key.
        const APOD_URL = "https://science.nasa.gov/wp-json/wp/v2/apod-basic?per_page=1";

        async function fetchApod() {
            const res = await fetch(APOD_URL);
            if (!res.ok) throw new Error("NASA API returned HTTP " + res.status);
            const data = await res.json();
            // The collection endpoint returns an array (newest first); a single-date route returns an object
            const item = Array.isArray(data) ? data[0] : data;
            if (!item) throw new Error("NASA API returned no APOD entries");
            return item;
        }

        const looksLikeImage = (u) => typeof u === "string" && /\.(jpe?g|png|gif|webp)(\?|$)/i.test(u);

        function toEmbedUrl(u) {
            if (typeof u !== "string") return null;
            let m = u.match(/youtube\.com\/watch\?v=([\w-]+)/) || u.match(/youtu\.be\/([\w-]+)/) || u.match(/youtube\.com\/embed\/([\w-]+)/);
            if (m) return "https://www.youtube.com/embed/" + m[1];
            m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/);
            if (m) return "https://player.vimeo.com/video/" + m[1];
            return null;
        }

        function createImageDiv(source) {
            const imageDiv = document.createElement("div")
            imageDiv.className = "image-background"
            const img = document.createElement("img")
            img.src = source
            img.alt = ""
            imageDiv.appendChild(img)
            document.body.appendChild(imageDiv)
        }

        function plainText(html) {
            const d = document.createElement("div")
            d.innerHTML = html || ""
            return d.textContent.trim()
        }

        function renderApod(nasa) {
            console.log("APOD data:", nasa)
            const pageLink = nasa.permalink || nasa.url || nasa.hdurl

            const title = document.getElementsByTagName("h1")[0]
            title.textContent = plainText(nasa.title && nasa.title.rendered ? nasa.title.rendered : nasa.title)
            title.addEventListener("click", function () {
                if (pageLink) window.open(pageLink, '_blank')
            })

            const explanation = nasa.explanation || ""
            document.getElementsByTagName("h2")[0].textContent = plainText(explanation)
            if (nasa.copyright) {
                document.getElementsByTagName("h3")[0].textContent = "Copyright: " + plainText(nasa.copyright)
            }

            const nasaLink = document.getElementsByTagName("h4")[0]
            nasaLink.addEventListener("click", function () {
                window.open("https://science.nasa.gov/apod/", '_blank')
            })

            const imageSrc = looksLikeImage(nasa.hdurl) ? nasa.hdurl : (looksLikeImage(nasa.url) ? nasa.url : (nasa.hdurl || null))
            const embed = nasa.media_type === "video" ? (toEmbedUrl(nasa.url) || toEmbedUrl(nasa.hdurl)) : null

            if (embed) {
                const id = embed.split("/").pop()
                const videoDiv = document.createElement("div")
                videoDiv.className = "video-background"
                videoDiv.innerHTML = `
                <div class="video-foreground">
                <iframe src="${embed}?playlist=${id}&autoplay=1&mute=1&loop=1&controls=0" frameborder="0" allow="autoplay"></iframe>
                </div>`
                document.body.appendChild(videoDiv)
            } else if (imageSrc) {
                createImageDiv(imageSrc)
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                renderApod(await fetchApod())
            } catch (err) {
                console.error(err)
                document.getElementsByTagName("h1")[0].textContent = "Could not load NASA data"
                document.getElementsByTagName("h2")[0].textContent = String(err.message || err)
            }
        })

        function runEMGenerator() {
            const getRandomNumber = (min, max) => Math.floor(Math.random() * (max - min + 1) + min)

            function getNumberArr(amount, max) {
                let arr = [];
                while (arr.length < amount) {
                    let newNumber = getRandomNumber(1, max);
                    // Check for repeats and consecutive numbers
                    if (!arr.includes(newNumber) && !arr.includes(newNumber + 1) && !arr.includes(newNumber - 1)) {
                        arr.push(newNumber);
                    }
                }
                return arr.sort((a, b) => a - b);
            }

            const numbers = getNumberArr(5, 50);
            const stars = getNumberArr(2, 12);

            for (let i = 0; i < 5; i++) {
                document.getElementById(`td${i + 1}`).innerHTML = numbers[i];
                document.getElementById(`td${i + 1}`).classList.add("shadow");
            }
            for (let i = 0; i < 2; i++) {
                document.getElementById(`td${i + 6}`).innerHTML = stars[i];
                document.getElementById(`td${i + 6}`).classList.add("shadow");
            }
        }
    </script>

    <style>
        /* RESET & BASE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        body {
            background-color: rgb(48, 48, 48);
            font-family: 'Courier New', monospace;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* BACKGROUNDS */
        .video-background,
        .image-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #000;
        }

        .video-background iframe,
        .image-background img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        /* MAIN CONTAINER */
        .main-container {
            width: 95%;
            max-width: 800px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* GENERATOR BOX */
        .numbers-box {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 30px 15px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        table {
            margin: 20px auto;
            border-collapse: separate;
            border-spacing: 10px;
        }

        td {
            width: 80px;
            /* Increased from 50px */
            height: 80px;
            /* Increased from 50px */
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            font-size: 40px;
            /* Increased font size */
            font-weight: bold;
            vertical-align: middle;
            opacity: 0;
            transition: opacity 0.5s, transform 0.3s;
        }

        .table2 td {
            background: rgba(255, 215, 0, 0.2);
            /* Gold tint for stars */
            border: 1px solid rgba(255, 215, 0, 0.4);
        }

        .shadow {
            opacity: 1;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* BUTTON */
        .button {
            font-size: 20px;
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background-color: #ff6347;
            color: white;
            transition: 0.3s;
            margin-top: 10px;
        }

        .button:active {
            transform: scale(0.95);
        }

        /* NASA TEXT AREA */
        .nasa-info {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 25px;
            border-radius: 15px;
            line-height: 1.6;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            cursor: pointer;
            color: #ffebcd;
        }

        h2 {
            font-size: 16px;
            font-weight: normal;
            margin: 15px 0;
            text-align: justify;
        }

        h3 {
            font-size: 14px;
            opacity: 0.8;
        }

        h4 {
            font-size: 18px;
            margin-top: 20px;
            cursor: pointer;
            letter-spacing: 5px;
        }

        /* SCROLL SPACE: extra height so you can scroll down to the clean image */
        .scroll-spacer {
            height: 100vh;
        }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 600px) {
            td {
                width: 60px;
                /* Adjusted for mobile screens */
                height: 60px;
                font-size: 30px;
                /* Larger mobile font */
            }

            h1 {
                font-size: 22px;
            }

            table {
                border-spacing: 8px;
            }

            .main-container {
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="numbers-box">
            <table class="table1">
                <tr>
                    <td id="td1"></td>
                    <td id="td2"></td>
                    <td id="td3"></td>
                    <td id="td4"></td>
                    <td id="td5"></td>
                </tr>
            </table>
            <table class="table2">
                <tr>
                    <td id="td6"></td>
                    <td id="td7"></td>
                </tr>
            </table>
            <button class="button" onclick="runEMGenerator()">Get Numbers</button>
        </div>

        <div class="nasa-info">
            <h1></h1>
            <h3></h3>
            <h2></h2>
            <h4>NASA APOD</h4>
        </div>
    </div>
    <div class="scroll-spacer"></div>
</body>

</html>
