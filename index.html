<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Euro - Milhões</title>

    <script>
        function loadJSON(callback) {
            let req = new XMLHttpRequest();
            req.onreadystatechange = () => {
                if (req.readyState == XMLHttpRequest.DONE) {
                    if (req.status === 200) {
                        let nasa = JSON.parse(req.responseText);
                        callback(nasa);
                    } else {
                        console.log(req.status)
                    }
                }
            };
            req.open("GET", "https://api.nasa.gov/planetary/apod/?api_key=VLS3BICJ3EYR1GDrQpREEPXNMaOtyhX7SiZOs3qN", true);
            req.send();
        }

        function createImageDiv(source) {
            const imageDiv = document.createElement("div")
            imageDiv.className = "image-background"
            imageDiv.innerHTML = `<img src="${source}" alt="">`
            document.body.appendChild(imageDiv)
        }

        loadJSON(function getJsonFromServer(nasa) {
            const title = document.getElementsByTagName("h1")[0]
            title.innerHTML = nasa.title
            title.addEventListener("click", function () {
                window.open(nasa.hdurl || nasa.url, '_blank')
            })

            document.getElementsByTagName("h2")[0].innerHTML = nasa.explanation
            if (nasa.hasOwnProperty('copyright')) {
                document.getElementsByTagName("h3")[0].innerHTML = "Copyright: " + nasa.copyright
            }

            const nasaLink = document.getElementsByTagName("h4")[0]
            nasaLink.addEventListener("click", function () {
                window.open("https://apod.nasa.gov/apod/astropix.html", '_blank')
            })

            if (nasa.media_type === "video") {
                const videoDiv = document.createElement("div")
                videoDiv.className = "video-background"
                videoDiv.innerHTML = `
                <div class="video-foreground">
                <iframe src="${nasa.url}?&playlist=${nasa.url.split("/").slice(-1)[0].split("?")[0]}&autoplay=1&mute=1&loop=1&controls=0" frameborder="0" allow="autoplay"></iframe>
                </div>`
                document.body.appendChild(videoDiv)
            } else if (nasa.media_type === "image") {
                createImageDiv(nasa.hdurl || nasa.url)
            }
        })

        function runEMGenerator() {
            const getRandomNumber = (min, max) => Math.floor(Math.random() * (max - min + 1) + min)

            function getNumberArr(amount, max) {
                let arr = [];
                while (arr.length < amount) {
                    let newNumber = getRandomNumber(1, max);
                    // Check for repeats and consecutive numbers
                    if (!arr.includes(newNumber) && !arr.includes(newNumber + 1) && !arr.includes(newNumber - 1)) {
                        arr.push(newNumber);
                    }
                }
                return arr.sort((a, b) => a - b);
            }

            const numbers = getNumberArr(5, 50);
            const stars = getNumberArr(2, 12);

            for (let i = 0; i < 5; i++) {
                document.getElementById(`td${i + 1}`).innerHTML = numbers[i];
                document.getElementById(`td${i + 1}`).classList.add("shadow");
            }
            for (let i = 0; i < 2; i++) {
                document.getElementById(`td${i + 6}`).innerHTML = stars[i];
                document.getElementById(`td${i + 6}`).classList.add("shadow");
            }
        }
    </script>

    <style>
        /* RESET & BASE */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        body {
            background-color: rgb(48, 48, 48);
            font-family: 'Courier New', monospace;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* BACKGROUNDS */
        .video-background, .image-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #000;
        }

        .video-background iframe, .image-background img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        /* MAIN CONTAINER */
        .main-container {
            width: 95%;
            max-width: 800px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* GENERATOR BOX */
        .numbers-box {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 30px 15px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        table {
            margin: 20px auto;
            border-collapse: separate;
            border-spacing: 10px;
        }

        td {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            font-size: 24px;
            font-weight: bold;
            vertical-align: middle;
            opacity: 0;
            transition: opacity 0.5s, transform 0.3s;
        }

        .table2 td {
            background: rgba(255, 215, 0, 0.2); /* Gold tint for stars */
            border: 1px solid rgba(255, 215, 0, 0.4);
        }

        .shadow {
            opacity: 1;
            box-shadow: 0 0 15px rgba(255,255,255,0.3);
        }

        /* BUTTON */
        .button {
            font-size: 20px;
            padding: 15px 30px;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background-color: #ff6347;
            color: white;
            transition: 0.3s;
            margin-top: 10px;
        }

        .button:active { transform: scale(0.95); }

        /* NASA TEXT AREA */
        .nasa-info {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 25px;
            border-radius: 15px;
            line-height: 1.6;
        }

        h1 { font-size: 28px; margin-bottom: 15px; cursor: pointer; color: #ffebcd; }
        h2 { font-size: 16px; font-weight: normal; margin: 15px 0; text-align: justify; }
        h3 { font-size: 14px; opacity: 0.8; }
        h4 { font-size: 18px; margin-top: 20px; cursor: pointer; letter-spacing: 5px; }

        /* MOBILE OPTIMIZATION */
        @media (max-width: 600px) {
            td { width: 40px; height: 40px; font-size: 18px; }
            h1 { font-size: 22px; }
            table { border-spacing: 5px; }
            .main-container { margin: 20px auto; }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="numbers-box">
            <table class="table1">
                <tr>
                    <td id="td1"></td>
                    <td id="td2"></td>
                    <td id="td3"></td>
                    <td id="td4"></td>
                    <td id="td5"></td>
                </tr>
            </table>
            <table class="table2">
                <tr>
                    <td id="td6"></td>
                    <td id="td7"></td>
                </tr>
            </table>
            <button class="button" onclick="runEMGenerator()">Get Numbers</button>
        </div>

        <div class="nasa-info">
            <h1></h1>
            <h3></h3>
            <h2></h2>
            <h4>NASA APOD</h4>
        </div>
    </div>
</body>

</html>
